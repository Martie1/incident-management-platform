spring:
  application:
    name: platform
  mvc:
    problemdetails:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

logging:
  level:
    root: INFO
    incident.management.platform: INFO
    org.zalando.logbook.Logbook: TRACE
  structured:
    format:
      console: logstash

logbook:
  predicate:
    include:
      - path: /api/**
  obfuscate:
    json-body-fields:
      - email

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState, db
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
