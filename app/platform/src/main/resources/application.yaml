spring:
  application:
    name: platform
  mvc:
    problemdetails:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

logging:
  level:
    root: INFO
    incident.management.platform: INFO
    # Logbook writes request/response logs at TRACE
    org.zalando.logbook.Logbook: TRACE

logbook:
  predicate:
    include:
      - path: /api/**
  obfuscate:
    json-body-fields:
      - email
