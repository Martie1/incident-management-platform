# One ConfigMap per file in dashboards/. The Grafana sidecar from kube-prometheus-stack
# loads every ConfigMap labelled grafana_dashboard: "1".
{{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-{{ base $path | trimSuffix ".json" }}
  labels:
    app.kubernetes.io/part-of: incident-platform
    grafana_dashboard: "1"
data:
  {{ base $path }}: |-
    {{- $.Files.Get $path | nindent 4 }}
{{- end }}
