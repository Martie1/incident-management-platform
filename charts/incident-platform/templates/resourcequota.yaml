# no limits.cpu on purpose - containers only set CPU requests
apiVersion: v1
kind: ResourceQuota
metadata:
  name: incident-platform
  labels:
    app.kubernetes.io/part-of: incident-platform
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 3Gi
    limits.memory: 3Gi
    pods: "15"
    services: "10"
    persistentvolumeclaims: "4"
    requests.storage: 5Gi
