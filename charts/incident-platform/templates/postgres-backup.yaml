# Nightly pg_dump of the database to its own volume, dumps older than 7 days are removed.
# Run it by hand: kubectl create job manual-backup --from=cronjob/postgres-backup -n incident-app
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backup
  labels:
    app.kubernetes.io/name: postgres-backup
    app.kubernetes.io/part-of: incident-platform
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.postgres.backup.storage }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  labels:
    app.kubernetes.io/name: postgres-backup
    app.kubernetes.io/part-of: incident-platform
spec:
  schedule: {{ .Values.postgres.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres-backup
            app.kubernetes.io/part-of: incident-platform
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          containers:
            - name: pg-dump
              image: {{ .Values.postgres.image }}
              command: ["sh", "-c"]
              args:
                - |
                  set -e
                  pg_dump --file=/backup/{{ .Values.postgres.database }}-$(date +%Y%m%d-%H%M%S).sql
                  find /backup -name '*.sql' -mtime +7 -delete
                  ls -lh /backup
              env:
                - name: PGHOST
                  value: postgres
                - name: PGDATABASE
                  value: {{ .Values.postgres.database }}
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: password
              securityContext:
                allowPrivilegeEscalation: false
              resources:
                {{- toYaml .Values.postgres.backup.resources | nindent 16 }}
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: postgres-backup
