# default values for app chart

global:
  environment: production

# backend configuration
app:
  replicaCount: 2
  image:
    repository: ghcr.io/martie1/incident-management-platform/backend
    pullPolicy: Always
    tag: "9dfd63b"
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  probes:
    liveness:
      enabled: true
      path: /api/incidents
      port: 8080
      initialDelaySeconds: 45
      periodSeconds: 15
      failureThreshold: 3
    readiness:
      enabled: true
      path: /api/incidents
      port: 8080
      initialDelaySeconds: 25
      periodSeconds: 10
      failureThreshold: 3
  env:
    springProfilesActive: prod

# frontend configuration
frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/martie1/incident-management-platform/frontend
    pullPolicy: Always
    tag: "9dfd63b"
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

# database configuration
postgresql:
  image:
    repository: postgres
    tag: "18-alpine"
    pullPolicy: IfNotPresent
  service:
    port: 5432
  auth:
    database: incidents
    username: platform
    password: platformSecretPassword123
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

# servicemonitor for prometheus
serviceMonitor:
  enabled: true
  interval: 15s
  scrapeTimeout: 10s
  path: /actuator/prometheus
  labels:
    release: prometheus-stack

# ingress configuration
ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  hosts:
    - host: incident-platform.local
      paths:
        - path: /
          pathType: Prefix
          service: frontend
        - path: /api
          pathType: Prefix
          service: app
