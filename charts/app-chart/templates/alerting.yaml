{{- if .Values.alerting.enabled }}
# Alertmanager merges this route under its root, limited to alerts with namespace=<release namespace>
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: {{ include "app-chart.fullname" . }}-alerting
  labels:
    {{- include "app-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: monitoring
spec:
  route:
    receiver: alert-logger
    # per pod/container so commonAnnotations.summary (alert notifications panel) is always set
    groupBy: [alertname, severity, pod, container]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: {{ .Values.alerting.repeatInterval }}
  inhibitRules:
    - sourceMatch:
        - name: alertname
          value: BackendDown
      targetMatch:
        - name: alertname
          value: BackendPodDown
      equal: [namespace]
    - sourceMatch:
        - name: alertname
          value: PostgresDown
      targetMatch:
        - name: alertname
          value: ExporterDown
        - name: container
          value: postgres-exporter
      equal: [namespace]
  receivers:
    - name: alert-logger
      webhookConfigs:
        - url: http://{{ include "app-chart.fullname" . }}-alert-logger.{{ .Release.Namespace }}.svc:8080/alerts
          sendResolved: true
---
# echo server that logs every webhook as one json line, promtail ships it to loki
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app-chart.fullname" . }}-alert-logger
  labels:
    {{- include "app-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: alert-logger
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "app-chart.alertLoggerSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app-chart.alertLoggerSelectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: alert-logger
          image: "{{ .Values.alerting.logger.image.repository }}:{{ .Values.alerting.logger.image.tag }}"
          imagePullPolicy: {{ .Values.alerting.logger.image.pullPolicy }}
          env:
            - name: LOG_WITHOUT_NEWLINE
              value: "true"
            - name: LOG_IGNORE_PATH
              value: /healthz
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.alerting.logger.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "app-chart.fullname" . }}-alert-logger
  labels:
    {{- include "app-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: alert-logger
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "app-chart.alertLoggerSelectorLabels" . | nindent 4 }}
{{- end }}
