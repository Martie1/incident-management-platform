apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "app-chart.fullname" . }}-config
  labels:
    {{- include "app-chart.labels" . | nindent 4 }}
data:
  DB_HOST: "{{ include "app-chart.fullname" . }}-db"
  DB_PORT: "{{ .Values.postgresql.service.port }}"
  DB_NAME: {{ .Values.postgresql.auth.database | quote }}
  SPRING_DATASOURCE_URL: "jdbc:postgresql://{{ include "app-chart.fullname" . }}-db:{{ .Values.postgresql.service.port }}/{{ .Values.postgresql.auth.database }}"
  SPRING_PROFILES_ACTIVE: {{ .Values.app.env.springProfilesActive | quote }}
