apiVersion: v1
kind: Service
metadata:
  name: {{ include "app-chart.fullname" . }}-db
  labels:
    {{- include "app-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.postgresql.service.port }}
      targetPort: 5432
      protocol: TCP
      name: postgresql
  selector:
    {{- include "app-chart.dbSelectorLabels" . | nindent 4 }}
