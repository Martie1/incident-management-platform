apiVersion: v1
kind: Secret
metadata:
  name: {{ include "app-chart.fullname" . }}-secret
  labels:
    {{- include "app-chart.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.postgresql.auth.database | quote }}
  POSTGRES_USER: {{ .Values.postgresql.auth.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.auth.password | quote }}
  SPRING_DATASOURCE_USERNAME: {{ .Values.postgresql.auth.username | quote }}
  SPRING_DATASOURCE_PASSWORD: {{ .Values.postgresql.auth.password | quote }}
