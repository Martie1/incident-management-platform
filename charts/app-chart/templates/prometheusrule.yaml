{{- if .Values.prometheusRule.enabled }}
{{- $fullname := include "app-chart.fullname" . }}
{{- $backend := printf "job=\"%s-app\", namespace=\"%s\"" $fullname .Release.Namespace }}
{{- $api := printf "%s, uri!~\"/actuator.*\"" $backend }}
{{- $ns := printf "namespace=\"%s\"" .Release.Namespace }}
{{- $t := .Values.prometheusRule.thresholds }}
{{- $exporters := list }}
{{- if .Values.postgresExporter.enabled }}{{ $exporters = append $exporters "postgres-exporter" }}{{ end }}
{{- if .Values.sqlExporter.enabled }}{{ $exporters = append $exporters "sql-exporter" }}{{ end }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ $fullname }}-rules
  labels:
    {{- include "app-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: monitoring
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    # recording rules: API SLIs computed once, reused by alerts
    - name: incident-platform.recording
      rules:
        - record: job:http_server_requests:rate5m
          expr: sum by (job, namespace) (rate(http_server_requests_seconds_count{ {{- $api -}} }[5m]))
        # "or ... * 0": no 5xx series yet means 0%, not no data
        - record: job:http_server_requests_5xx:ratio_rate5m
          expr: |
            (
              sum by (job, namespace) (rate(http_server_requests_seconds_count{ {{- $api -}}, status=~"5.."}[5m]))
              or sum by (job, namespace) (rate(http_server_requests_seconds_count{ {{- $api -}} }[5m])) * 0
            )
            / sum by (job, namespace) (rate(http_server_requests_seconds_count{ {{- $api -}} }[5m]))
        - record: job:http_server_requests_seconds:p95_5m
          expr: histogram_quantile(0.95, sum by (job, namespace, le) (rate(http_server_requests_seconds_bucket{ {{- $api -}} }[5m])))

    {{- /* absent() fires forever for targets that aren't deployed, so each rule follows its flag */}}
    {{- if .Values.serviceMonitor.enabled }}
    - name: incident-platform.availability
      rules:
        - alert: BackendDown
          expr: absent(up{ {{- $backend -}} } == 1)
          for: 1m
          labels:
            severity: critical
            # absent() drops all labels, the AlertmanagerConfig route needs namespace
            namespace: {{ .Release.Namespace }}
          annotations:
            summary: Backend is down
            description: No backend pod in {{ .Release.Namespace }} can be scraped for 1 minute, the API is unavailable.
        - alert: BackendPodDown
          expr: up{ {{- $backend -}} } == 0
          for: 3m
          labels:
            severity: warning
          annotations:
            summary: Backend pod {{ "{{ $labels.pod }}" }} is down
            description: Prometheus can't scrape {{ "{{ $labels.pod }}" }} for 3 minutes, the remaining replicas take the traffic.
        {{- if .Values.postgresExporter.enabled }}
        - alert: PostgresDown
          expr: absent(pg_up{ {{- $ns -}} } == 1)
          for: 1m
          labels:
            severity: critical
            namespace: {{ .Release.Namespace }}
          annotations:
            summary: PostgreSQL is down
            description: postgres_exporter can't connect to the database or its pod is gone for 1 minute.
        {{- end }}
        {{- if $exporters }}
        - alert: ExporterDown
          # target="" skips sql_exporter's own up, which reports the db connection
          expr: |
            {{- range $i, $c := $exporters }}
            {{ if $i }}or {{ end }}label_replace(absent(up{ {{- $ns -}}, container="{{ $c }}", target=""} == 1), "container", "{{ $c }}", "", "")
            {{- end }}
          for: 5m
          labels:
            severity: warning
            namespace: {{ .Release.Namespace }}
          annotations:
            summary: Exporter {{ "{{ $labels.container }}" }} is down
            description: "{{ "{{ $labels.container }}" }} has no healthy target for 5 minutes, its dashboards and alerts are blind."
        {{- end }}
    {{- end }}

    - name: incident-platform.http
      rules:
        - alert: HighErrorRate
          # min traffic, otherwise 1 failed request out of 2 is already 50%
          expr: |
            job:http_server_requests_5xx:ratio_rate5m{ {{- $ns -}} } > {{ $t.errorRatio }}
            and job:http_server_requests:rate5m{ {{- $ns -}} } > {{ $t.errorRateMinRps }}
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: High 5xx error rate
            description: "{{ "{{ $value | humanizePercentage }}" }} of API requests fail with 5xx (threshold {{ round (mulf $t.errorRatio 100) 2 }}%, at least {{ $t.errorRateMinRps }} req/s)."
        - alert: HighLatencyP95
          expr: job:http_server_requests_seconds:p95_5m{ {{- $ns -}} } > {{ $t.latencyP95Seconds }}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Slow API responses
            description: p95 API latency is {{ "{{ $value | humanizeDuration }}" }} (threshold {{ $t.latencyP95Seconds }}s).

    - name: incident-platform.business
      rules:
        - alert: CriticalIncidentOpenTooLong
          expr: incident_platform_oldest_open_incident_age_seconds{ {{- $ns -}}, severity="CRITICAL"} > {{ $t.criticalIncidentMaxAgeSeconds }}
          # no for: the age only grows; keep_firing_for rides out sql_exporter restarts
          keep_firing_for: 10m
          labels:
            severity: critical
          annotations:
            summary: Critical incident unresolved for too long
            description: The oldest unresolved CRITICAL incident is {{ "{{ $value | humanizeDuration }}" }} old (limit {{ $t.criticalIncidentMaxAgeSeconds }}s).
        - alert: UnassignedIncidentsPilingUp
          expr: incident_platform_unassigned_open_incidents{ {{- $ns -}} } > {{ $t.unassignedIncidents }}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Too many unassigned incidents
            description: "{{ "{{ $value }}" }} unresolved incidents have no assignee for 15 minutes (threshold {{ $t.unassignedIncidents }})."
{{- end }}
