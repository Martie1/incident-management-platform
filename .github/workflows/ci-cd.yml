name: CI/CD Pipeline & GitOps Auto-Update

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'charts/app-chart/values.yaml'

# a newer push to main supersedes the running pipeline - only the latest commit gets deployed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# least privilege by default, jobs ask for more when they need it
permissions:
  contents: read

jobs:
  backend:
    name: Backend - test & build jar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run tests (Spock & Spring Boot) and build jar
        working-directory: app/platform
        run: ./gradlew test bootJar

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: backend-jar
          path: app/platform/build/libs/app.jar
          retention-days: 1

  frontend:
    name: Frontend - test & build bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: app/frontend/.nvmrc
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json

      - name: Run tests (Vitest) and build bundle
        working-directory: app/frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: app/frontend/dist
          retention-days: 1

  backend-image:
    name: Backend image
    needs: backend
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_docker-image.yml
    with:
      name: backend
      context: app/platform
      artifact: backend-jar
      artifact-path: build/libs

  frontend-image:
    name: Frontend image
    needs: frontend
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_docker-image.yml
    with:
      name: frontend
      context: app/frontend
      artifact: frontend-dist
      artifact-path: dist

  update-gitops:
    name: Update Helm Values for ArgoCD GitOps
    needs: [backend-image, frontend-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Update image tags in Helm values.yaml
        env:
          BACKEND_TAG: ${{ needs.backend-image.outputs.tag }}
          FRONTEND_TAG: ${{ needs.frontend-image.outputs.tag }}
        run: |
          yq -i '
            .app.image.tag = strenv(BACKEND_TAG) |
            .frontend.image.tag = strenv(FRONTEND_TAG)
          ' charts/app-chart/values.yaml
          git diff charts/app-chart/values.yaml

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/app-chart/values.yaml
          git diff --staged --quiet && exit 0
          git commit -m "chore(gitops): auto-update images to ${GITHUB_SHA::7} [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
