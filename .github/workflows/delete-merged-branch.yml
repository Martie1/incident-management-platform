name: Delete merged branch

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete-branch:
    name: Delete ${{ github.head_ref }}
    if: >-
      github.event.pull_request.merged &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref != github.event.repository.default_branch
    runs-on: ubuntu-latest

    steps:
      - name: Delete head branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref }}
        run: |
          if gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}"; then
            echo "deleted branch ${BRANCH}"
          else
            # someone may have clicked "Delete branch" in the PR already
            gh api "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" > /dev/null 2>&1 && exit 1
            echo "branch ${BRANCH} already deleted"
          fi
