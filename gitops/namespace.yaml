# Applied by setup.sh before ArgoCD, because the postgres-credentials Secret has to be created in it first.
# Pod Security Admission: "baseline" is enforced (blocks privileged pods), "restricted" only warns -
# the official postgres image starts as root, which "restricted" would not allow.
apiVersion: v1
kind: Namespace
metadata:
  name: incident-app
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
