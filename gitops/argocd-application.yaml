apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: incident-management-platform
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Martie1/incident-management-platform.git
    targetRevision: main
    path: charts/incident-platform
  destination:
    server: https://kubernetes.default.svc
    namespace: incident-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
