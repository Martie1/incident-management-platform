prometheus:
  prometheusSpec:
    # pick up ServiceMonitors and PrometheusRules from all namespaces, not only this release's
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

grafana:
  sidecar:
    dashboards:
      # load dashboard ConfigMaps from all namespaces
      searchNamespace: ALL
